<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documentation — Akasha</title>
  <script>
  (async function () {
    const parts = await Promise.all(
      [1, 2, 3, 4].map((i) => fetch("docs.p" + i + ".inc", { cache: "no-cache" }).then((r) => {
        if (!r.ok) throw new Error("Failed to load docs.p" + i + ".inc");
        return r.text();
      }))
    );
    document.open();
    document.write(parts.join(""));
    document.close();
  })().catch(function (err) {
    document.body.textContent = "Failed to load documentation: " + err;
  });
  </script>
</head>
<body>
  <p>Loading documentation…</p>
</body>
</html>
