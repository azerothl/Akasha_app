<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Official documentation for Akasha — your privacy-first personal assistant." />
  <title>Documentation — Akasha</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <p id="docs-boot" style="font-family:system-ui,sans-serif;padding:2rem;color:#a1a1aa">Loading documentation…</p>
  <script>
  (async function () {
    const n = 31;
    const texts = await Promise.all(
      Array.from({ length: n }, (_, i) =>
        fetch("docs-parts/" + String(i + 1).padStart(2, "0") + ".txt", { cache: "no-cache" })
          .then((r) => { if (!r.ok) throw new Error("part " + (i + 1)); return r.text(); })
      )
    );
    document.open();
    document.write(texts.join(""));
    document.close();
  })().catch((err) => {
    const el = document.getElementById("docs-boot");
    if (el) el.textContent = "Failed to load documentation: " + err;
  });
  </script>
  <noscript>
    <p style="padding:2rem;font-family:system-ui">JavaScript is required to load the documentation page. Enable JS or open the Akasha repository docs.</p>
  </noscript>
</body>
</html>
