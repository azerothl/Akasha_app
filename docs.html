<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documentation — Akasha</title>
  <script>
  (async function () {
    function b64ToBytes(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }
    const n = 5;
    const parts = await Promise.all(
      Array.from({ length: n }, (_, idx) =>
        fetch("docs.gz.p" + (idx + 1) + ".txt", { cache: "no-cache" }).then((r) => {
          if (!r.ok) throw new Error("Failed to load docs.gz.p" + (idx + 1) + ".txt");
          return r.text();
        })
      )
    );
    const bytes = b64ToBytes(parts.join("").trim());
    const ds = new DecompressionStream("gzip");
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  })().catch(function (err) {
    document.body.textContent = "Failed to load documentation: " + err;
  });
  </script>
</head>
<body>
  <p>Loading documentation…</p>
</body>
</html>
